<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <style>
      .t{font-size:13px;fill:#334155}
      .s{font-family:Inter,'DejaVu Sans',sans-serif;font-size:11.5px;fill:#64748B}
      .h{font-size:15px;font-weight:700;fill:#0F172A}
      .hs{font-size:12px;font-weight:600;fill:#475569}
      .b{font-size:13.5px;font-weight:600;fill:#0F172A}
      .m{font-family:'DejaVu Sans Mono',monospace;font-size:11.5px;fill:#334155}
      .new{font-size:10px;font-weight:700;fill:#FFFFFF;letter-spacing:.6px}
      .lbl{font-size:11.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="30" y="46" font-size="26" font-weight="700" fill="#0F172A">PLAYAS (ATLAS) — Arquitectura de infraestructura en AWS</text>
  <text x="30" y="74" font-size="14" fill="#475569">AWS Academy Learner Lab · us-east-1 · Terraform ~&gt; 1.17.1 · 3 stacks independientes con Terraform State remoto en S3 · Rama infrastructure/platform-integration</text>
  <g transform="translate(1460,30)">
    <rect width="310" height="50" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
    <rect x="12" y="15" width="52" height="20" rx="10" fill="#B45309"/><text x="38" y="29" text-anchor="middle" class="new">NUEVO</text>
    <text x="74" y="23" font-size="12" font-weight="600" fill="#92400E">Aporte de esta entrega</text>
    <text x="74" y="39" font-size="11" fill="#92400E">(infraestructura · Paula Caballero)</text>
  </g>

  <!-- ===== Left column ===== -->
  <!-- Usuario -->
  <rect x="30" y="150" width="270" height="96" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="50" y="180" class="h">Usuario</text>
  <text x="50" y="202" class="t">Navegador web</text>
  <text x="50" y="222" class="s">Consulta normativa costera</text>

  <!-- Operador + CLI -->
  <rect x="30" y="290" width="270" height="420" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="226" y="302" width="60" height="20" rx="10" fill="#B45309"/><text x="256" y="316" text-anchor="middle" class="new">NUEVO</text>
  <text x="50" y="322" class="h">Operador</text>
  <text x="50" y="342" class="s">Ubuntu / WSL · AWS CLI v2</text>
  <text x="50" y="358" class="s">credenciales temporales del lab</text>
  <rect x="46" y="372" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="165" y="392" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="700" fill="#92400E">scripts/playas.sh</text>
  <g class="m">
    <text x="56" y="426">doctor</text><text x="148" y="426" class="s">entorno, cuenta, región</text>
    <text x="56" y="446">bootstrap</text><text x="148" y="446" class="s">bucket del State</text>
    <text x="56" y="466">plan</text><text x="148" y="466" class="s">init + plan por stack</text>
    <text x="56" y="486">deploy</text><text x="148" y="486" class="s">apply con confirmación</text>
    <text x="56" y="506">status</text><text x="148" y="506" class="s">recursos, locks, costes</text>
    <text x="56" y="526">health</text><text x="148" y="526" class="s">endpoints y targets ALB</text>
    <text x="56" y="546">backup-state</text><text x="148" y="546" class="s">State cifrado con GPG</text>
    <text x="56" y="566">start | stop</text><text x="148" y="566" class="s">encender / apagar</text>
    <text x="56" y="586">test</text><text x="148" y="586" class="s">static | unit | all</text>
  </g>
  <line x1="46" y1="602" x2="284" y2="602" stroke="#FCD34D"/>
  <text x="50" y="622" class="hs">Orden: ① ingesta → ② vector → ③ rag</text>
  <text x="50" y="642" class="s">Reutiliza el deploy.sh de cada stack</text>
  <text x="50" y="660" class="s">Nunca: destroy, -auto-approve,</text>
  <text x="50" y="676" class="s">-migrate-state, import, force-unlock</text>
  <text x="50" y="694" class="s">Falla cerrado ante cualquier error</text>

  <!-- CI -->
  <rect x="30" y="740" width="270" height="140" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="226" y="752" width="60" height="20" rx="10" fill="#B45309"/><text x="256" y="766" text-anchor="middle" class="new">NUEVO</text>
  <text x="50" y="772" class="h">GitHub Actions</text>
  <text x="50" y="792" class="hs">job infra-static</text>
  <text x="50" y="814" class="s">playas.sh test static, sin credenciales:</text>
  <text x="50" y="832" class="s">terraform fmt · validate · test (mock)</text>
  <text x="50" y="850" class="s">shellcheck 0.10 · permisos mínimos</text>
  <text x="50" y="868" class="s">+ rag-test: pruebas unitarias de scripts</text>

  <!-- Backup -->
  <rect x="30" y="910" width="270" height="120" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="226" y="922" width="60" height="20" rx="10" fill="#B45309"/><text x="256" y="936" text-anchor="middle" class="new">NUEVO</text>
  <text x="50" y="942" class="h">Respaldo fuera de AWS</text>
  <text x="50" y="964" class="s">state pull → GPG (sin copia en claro)</text>
  <text x="50" y="982" class="s">&lt;stack&gt;-&lt;UTC&gt;.tfstate.gpg + .sha256</text>
  <text x="50" y="1000" class="s">permisos 600 · fuera del clon</text>
  <text x="50" y="1018" class="s">el Learner Lab puede reiniciarse</text>

  <!-- ===== AWS account ===== -->
  <rect x="340" y="110" width="1430" height="985" rx="14" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <rect x="340" y="110" width="250" height="30" rx="14" fill="#232F3E"/>
  <rect x="340" y="125" width="250" height="15" fill="#232F3E"/>
  <text x="358" y="131" font-size="13" font-weight="700" fill="#FFFFFF">Cuenta AWS Academy</text>
  <text x="604" y="131" class="s">us-east-1 · VPC por defecto · IAM: LabRole / LabInstanceProfile (sin roles propios)</text>

  <!-- Stack rag -->
  <rect x="365" y="155" width="815" height="490" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="390" cy="181" r="12" fill="#3B82F6"/><text x="390" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="410" y="186" class="h">Stack rag</text>
  <text x="494" y="186" class="m">rag/infrastructure/</text>
  <text x="1160" y="186" text-anchor="end" class="m">key: rag-infrastructure/terraform.tfstate</text>

  <!-- ALB -->
  <rect x="390" y="300" width="170" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
  <text x="408" y="328" class="b">Application LB</text>
  <text x="408" y="348" class="t">listener HTTP :80</text>
  <text x="408" y="368" class="s">SG alb (público :80)</text>
  <text x="408" y="386" class="s">reglas /api/* y /*</text>
  <text x="408" y="404" class="s">2 target groups</text>

  <!-- ECS cluster -->
  <rect x="610" y="210" width="545" height="275" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-dasharray="5 4"/>
  <text x="628" y="234" class="hs">ECS Fargate · cluster rag-playas-prod</text>
  <rect x="628" y="248" width="510" height="110" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="646" y="274" class="b">Servicio app · 1 vCPU / 2 GB</text>
  <text x="646" y="296" class="t">FastAPI + LangGraph RAG  :8080</text>
  <text x="646" y="316" class="t">Postgres (sidecar)  :5432</text>
  <text x="646" y="338" class="s">SG app (solo desde ALB) + SG vector_clients · ECS Exec</text>
  <rect x="628" y="372" width="510" height="95" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="646" y="398" class="b">Servicio frontend · 0.25 vCPU / 0.5 GB</text>
  <text x="646" y="420" class="t">Next.js  :3000</text>
  <text x="646" y="442" class="s">SG frontend (solo desde ALB)</text>

  <!-- Storage row -->
  <rect x="610" y="505" width="200" height="118" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
  <text x="626" y="530" class="b">EFS</text>
  <text x="626" y="550" class="s">datos de Postgres</text>
  <text x="626" y="567" class="s">cifrado · access point · IAM</text>
  <rect x="626" y="580" width="122" height="20" rx="10" fill="#B45309"/><text x="687" y="594" text-anchor="middle" class="new">prevent_destroy</text>

  <rect x="830" y="505" width="160" height="118" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
  <text x="846" y="530" class="b">ECR</text>
  <text x="846" y="550" class="s">backend · frontend</text>
  <text x="846" y="567" class="s">scan on push</text>
  <text x="846" y="584" class="s">lifecycle policy</text>

  <rect x="1010" y="505" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#3B82F6"/>
  <text x="1026" y="530" class="b">CloudWatch</text>
  <text x="1026" y="550" class="s">Logs app/frontend</text>
  <text x="1026" y="567" class="s">retención 14 días</text>
  <text x="1026" y="584" class="s">Container Insights</text>

  <!-- Stack vector -->
  <rect x="1220" y="155" width="525" height="490" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="1245" cy="181" r="12" fill="#7C3AED"/><text x="1245" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="1265" y="186" class="h">Stack vector</text>
  <text x="1362" y="186" class="m">vector-infraestructura/</text>
  <text x="1240" y="208" class="m">key: vector-infraestructura/terraform.tfstate</text>

  <rect x="1240" y="225" width="485" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <rect x="1252" y="235" width="60" height="20" rx="10" fill="#B45309"/><text x="1282" y="249" text-anchor="middle" class="new">NUEVO</text>
  <text x="1322" y="250" class="t"><tspan font-weight="600">SG vector_clients</tspan> — solo ECS por IP privada</text>

  <rect x="1240" y="280" width="485" height="120" rx="10" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="1258" y="306" class="b">EC2 ChromaDB · t3.large</text>
  <text x="1258" y="326" class="t">base vectorial  :8000  · Elastic IP</text>
  <text x="1258" y="346" class="s">índice reconstruido desde data/*.jsonl.gz</text>
  <text x="1258" y="364" class="s">SSH y :8000 público solo desde /32 del operador</text>
  <rect x="1258" y="372" width="122" height="20" rx="10" fill="#B45309"/><text x="1319" y="386" text-anchor="middle" class="new">prevent_destroy</text>

  <rect x="1240" y="415" width="485" height="120" rx="10" fill="#FFFFFF" stroke="#7C3AED"/>
  <text x="1258" y="441" class="b">EC2 Ollama · t3.large</text>
  <text x="1258" y="461" class="t">embeddings  :11434  · Elastic IP</text>
  <text x="1258" y="481" class="s">modelo de embeddings para el RAG</text>
  <text x="1258" y="499" class="s">SSH y :11434 público solo desde /32 del operador</text>
  <rect x="1258" y="507" width="122" height="20" rx="10" fill="#B45309"/><text x="1319" y="521" text-anchor="middle" class="new">prevent_destroy</text>

  <text x="1240" y="565" class="s">Antes: 8000, 11434 y 22 abiertos a 0.0.0.0/0.</text>
  <text x="1240" y="583" class="s">Ahora: variables validadas (solo /32) y</text>
  <text x="1240" y="601" class="s">migración sin cortes con legacy_public_service_access.</text>
  <text x="1240" y="625" class="s">Pruebas: tests/network.tftest.hcl · no_replace.tftest.hcl</text>

  <!-- Stack ingesta -->
  <rect x="940" y="680" width="380" height="250" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <circle cx="965" cy="706" r="12" fill="#16A34A"/><text x="965" y="711" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="985" y="711" class="h">Stack ingesta</text>
  <text x="1092" y="711" class="m">ingesta/infrastructure/</text>
  <text x="960" y="733" class="m">key: ingesta/terraform.tfstate</text>
  <rect x="960" y="748" width="340" height="125" rx="10" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="978" y="774" class="b">S3 rag-playas-data-&lt;cuenta&gt;</text>
  <text x="978" y="794" class="t">corpus normativo y exports</text>
  <text x="978" y="814" class="s">versionado · SSE · Block Public Access</text>
  <text x="978" y="832" class="s">la escribe el pipeline de ingesta</text>
  <rect x="978" y="842" width="122" height="20" rx="10" fill="#B45309"/><text x="1039" y="856" text-anchor="middle" class="new">prevent_destroy</text>
  <rect x="1110" y="842" width="172" height="20" rx="10" fill="#B45309"/><text x="1196" y="856" text-anchor="middle" class="new">deploy.sh + CLI (nuevo)</text>
  <text x="960" y="905" class="s">Antes: sin script de despliegue ni protección</text>

  <!-- Terraform State -->
  <rect x="365" y="680" width="545" height="390" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="826" y="694" width="70" height="20" rx="10" fill="#B45309"/><text x="861" y="708" text-anchor="middle" class="new">NUEVO</text>
  <text x="385" y="711" class="h">Terraform State remoto</text>
  <text x="385" y="733" class="m">S3 rag-playas-tfstate-&lt;cuenta&gt;  (1 bucket por cuenta)</text>
  <rect x="385" y="750" width="505" height="112" rx="8" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="401" y="772" class="hs">Una key por stack · lock nativo use_lockfile (&lt;key&gt;.tflock)</text>
  <text x="401" y="796" class="m">ingesta/terraform.tfstate</text>
  <text x="401" y="818" class="m">vector-infraestructura/terraform.tfstate</text>
  <text x="401" y="840" class="m">rag-infrastructure/terraform.tfstate</text>
  <text x="385" y="888" class="hs">Controles del bucket (bootstrap_tfstate_bucket.sh)</text>
  <text x="401" y="910" class="t">✓ Versioning           ✓ Cifrado SSE-S3</text>
  <text x="401" y="930" class="t">✓ Block Public Access   ✓ BucketOwnerEnforced</text>
  <text x="401" y="950" class="t">✓ Política: denegar peticiones sin TLS</text>
  <text x="385" y="978" class="hs">Protecciones en los scripts (lib/terraform_state.sh)</text>
  <text x="401" y="1000" class="s">• key fija en terraform.tf: un stack no puede escribir la de otro</text>
  <text x="401" y="1018" class="s">• rechaza AWS_ENDPOINT_URL*, workspaces ≠ default y cuenta ajena</text>
  <text x="401" y="1036" class="s">• State vacío exige ALLOW_EMPTY_STATE=1 y revisa versiones previas</text>
  <text x="401" y="1054" class="s">• copia local (600) antes de cada apply · Antes: State local, sin lock</text>

  <!-- Contracts -->
  <rect x="1360" y="680" width="385" height="390" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="1660" y="694" width="70" height="20" rx="10" fill="#B45309"/><text x="1695" y="708" text-anchor="middle" class="new">NUEVO</text>
  <text x="1380" y="711" class="h">Contratos entre stacks</text>
  <text x="1380" y="731" class="s">outputs → rag/infrastructure/terraform.tfvars (600)</text>
  <g class="m">
    <text x="1380" y="764">chromadb_private_ip</text><text x="1380" y="780" class="s">  → chroma_host</text>
    <text x="1380" y="808">ollama_private_ip</text><text x="1380" y="824" class="s">  → ollama_base_url</text>
    <text x="1380" y="852">vector_clients_security_group_id</text><text x="1380" y="868" class="s">  → vector_clients_security_group_id</text>
    <text x="1380" y="896">s3_bucket_name (ingesta)</text><text x="1380" y="912" class="s">  → s3_bucket_name</text>
  </g>
  <line x1="1380" y1="932" x2="1725" y2="932" stroke="#FCD34D"/>
  <text x="1380" y="954" class="s">Sin terraform_remote_state: cada stack se</text>
  <text x="1380" y="972" class="s">planifica sin leer el State de otro.</text>
  <text x="1380" y="996" class="s">postgres_password y jwt_secret_key se generan</text>
  <text x="1380" y="1014" class="s">en el deploy; nunca en Git ni en la salida.</text>
  <text x="1380" y="1042" class="s">doctor valida que los contratos existan y que</text>
  <text x="1380" y="1060" class="s">el bucket sea de la cuenta actual.</text>

  <!-- ===== Arrows ===== -->
  <!-- user -> ALB -->
  <path d="M300,198 C350,198 340,365 388,365" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="392" y="290" class="lbl" fill="#2563EB">HTTP :80 (público)</text>
  <!-- ALB -> app/frontend -->
  <path d="M560,345 C590,345 595,303 626,303" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
  <text x="568" y="316" class="lbl" fill="#2563EB">/api/*</text>
  <path d="M560,395 C590,395 595,420 626,420" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
  <text x="577" y="426" class="lbl" fill="#2563EB">/*</text>
  <!-- app -> EFS -->
  <path d="M700,358 L700,372" stroke="none"/>
  <path d="M640,467 L640,503" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="648" y="499" class="s">NFS</text>
  <!-- ECR -> services -->
  <path d="M910,503 L910,469" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="918" y="499" class="s">imágenes</text>
  <!-- app -> chroma / ollama -->
  <path d="M1138,290 C1185,290 1195,330 1238,330" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#ap)"/>
  <path d="M1138,320 C1190,320 1190,465 1238,465" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#ap)"/>
  <rect x="1162" y="386" width="72" height="20" rx="4" fill="#FFFFFF" stroke="#C4B5FD"/><text x="1198" y="400" text-anchor="middle" class="lbl" fill="#7C3AED">IP privada</text>
  <!-- CLI -> State -->
  <path d="M300,690 C335,690 330,790 363,790" fill="none" stroke="#B45309" stroke-width="2.2" marker-end="url(#aa)"/>
  <text x="296" y="729" text-anchor="end" class="lbl" fill="#B45309">lock + state →</text>
  <!-- State -> backup -->
  <path d="M365,990 C335,990 335,970 302,970" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <!-- contracts -->
  <path d="M1500,645 L1500,678" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <path d="M1320,890 L1358,890" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <path d="M1360,700 C1300,700 1240,660 1182,620" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <text x="1218" y="676" class="lbl" fill="#B45309">tfvars</text>

  <!-- Legend -->
  <g transform="translate(30,1060)">
    <line x1="0" y1="0" x2="0" y2="0"/>
  </g>
  <g transform="translate(940,955)">
    <text x="0" y="0" class="hs">Leyenda</text>
    <line x1="0" y1="20" x2="34" y2="20" stroke="#2563EB" stroke-width="2.2"/><text x="42" y="24" class="s">tráfico de usuario</text>
    <line x1="190" y1="20" x2="224" y2="20" stroke="#7C3AED" stroke-width="2.2"/><text x="232" y="24" class="s">tráfico interno privado</text>
    <line x1="0" y1="44" x2="34" y2="44" stroke="#B45309" stroke-width="2.2"/><text x="42" y="48" class="s">operación / Terraform</text>
    <line x1="190" y1="44" x2="224" y2="44" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4"/><text x="232" y="48" class="s">contrato / respaldo</text>
    <circle cx="10" cy="72" r="9" fill="#64748B"/><text x="10" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="26" y="76" class="s">orden de despliegue (ingesta → vector → rag)</text>
    <text x="0" y="104" class="s">Sin NAT Gateway · HTTP en el ALB es un riesgo aceptado (ADR-001)</text>
  </g>
</svg>
