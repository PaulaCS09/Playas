name: CI

on:
  push:
    # main es la rama de integración activa. v2 se conserva en el disparador
    # por compatibilidad, aunque no recibe trabajo activo actualmente.
    branches: [main, develop, v2]
  pull_request:
    branches: [main]

# Ningún job necesita escribir en el repositorio ni credenciales de AWS.
permissions:
  contents: read

jobs:
  ingesta-quality:
    name: Ingesta — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "ingesta/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check ingest/ tests/

      - name: Ruff format check
        run: uv run ruff format --check ingest/ tests/

  ingesta-test:
    name: Ingesta — Unit Tests
    runs-on: ubuntu-latest
    needs: ingesta-quality
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "ingesta/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=ingest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ingesta/coverage.xml
          flags: ingesta
          fail_ci_if_error: false

  rag-quality:
    name: RAG — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "rag/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      - name: Ruff lint
        run: uv run ruff check backend/rag/ tests/ evaluation/ scripts/ utils/

      - name: Ruff format check
        run: uv run ruff format --check backend/rag/ tests/ evaluation/ scripts/ utils/

      # Mypy de este job comprueba backend/rag/.
      # Mypy global de ingesta se verifica por separado; sus imports de
      # boto3/botocore carecen de stubs en el entorno de ingesta.
      - name: Mypy
        run: uv run mypy backend/rag/

  rag-test:
    name: RAG — Unit Tests
    runs-on: ubuntu-latest
    needs: rag-quality
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "rag/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --group dev

      # Los tests de scripts de despliegue, secretos y red (A1, A2, A5) se
      # omiten si faltan bash u openssl: se exige que estén para que no se
      # salten en silencio. -ra muestra cualquier test omitido.
      - name: Check script test prerequisites
        run: |
          bash --version | head -1
          openssl version

      - name: Run unit tests
        run: uv run pytest tests/unit/ -ra --cov=rag --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: rag/coverage.xml
          flags: rag
          fail_ci_if_error: false

  rag-frontend-quality:
    name: RAG Frontend — Lint, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  infra-static:
    name: Infra — Terraform y shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Solo validaciones estáticas: sin credenciales, sin backend remoto y sin
    # contactar servicios desplegados. terraform init descarga los providers
    # del registry; terraform test usa mock_provider (sin llamadas a AWS).
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_STACKS: vector-infraestructura rag/infrastructure ingesta/infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      # Reutiliza los providers entre ejecuciones; la clave cambia con los lock files.
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      # Debe existir antes de cualquier comando de Terraform (TF_PLUGIN_CACHE_DIR).
      - name: Prepare plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform fmt
        run: |
          for stack in $TF_STACKS; do
            echo "::group::fmt $stack"
            terraform -chdir="$stack" fmt -check -recursive -diff
            echo "::endgroup::"
          done

      - name: Terraform init y validate (sin backend)
        run: |
          for stack in $TF_STACKS; do
            echo "::group::validate $stack"
            terraform -chdir="$stack" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

      - name: Terraform test (mock_provider)
        run: |
          for stack in $TF_STACKS; do
            if compgen -G "$stack/tests/*.tftest.hcl" > /dev/null; then
              echo "::group::test $stack"
              terraform -chdir="$stack" test
              echo "::endgroup::"
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"

      # Todos los scripts versionados salvo las utilidades de SageMaker, que no
      # forman parte del despliegue (sin shebang o con shebang en la línea 2).
      - name: Shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' ':!rag/scripts/sagemaker-*.sh')
          printf '%s\n' "${scripts[@]}"
          uvx --from shellcheck-py==0.10.0.1 shellcheck -S warning "${scripts[@]}"
